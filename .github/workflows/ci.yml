name: offline-raster-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: python:3.13-bookworm
      options: --cpus 2 --memory 1g --pids-limit 256
    env:
      PROJ_NETWORK: "OFF"
      GDAL_PAM_ENABLED: "NO"
      GDAL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install system metadata oracle
        timeout-minutes: 4
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gdal-bin util-linux
      - name: Install exact Python distribution versions
        timeout-minutes: 5
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Record real installed metadata and native libraries
        timeout-minutes: 1
        run: python tools/check_environment.py
      - name: Prepare unprivileged runtime paths
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/home" "$GITHUB_WORKSPACE/build/pytest-cache"
          chown -R 1000:1000 "$GITHUB_WORKSPACE"
          echo "HOME=$GITHUB_WORKSPACE/build/home" >> "$GITHUB_ENV"
          echo "PYTEST_ADDOPTS=-o cache_dir=build/pytest-cache" >> "$GITHUB_ENV"
      - name: Verify unprivileged zero-capability identity
        run: |
          setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs sh -eu -c '
            test "$(id -u)" = 1000
            test "$(id -G)" = 1000
            found=0
            while read -r key value rest; do
              case "$key" in
                CapInh:|CapPrm:|CapEff:|CapBnd:|CapAmb:)
                  test "$value" = 0000000000000000
                  found=$((found + 1)) ;;
                NoNewPrivs:)
                  test "$value" = 1
                  found=$((found + 1)) ;;
              esac
            done < /proc/self/status
            test "$found" -eq 6
            echo "UID1000, no supplementary groups, all capability sets zero, no-new-privileges"
          '
      - name: Serial numerical and adversarial tests
        timeout-minutes: 4
        run: setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs python -m pytest -q
      - name: Asserting offline demo
        timeout-minutes: 1
        run: setpriv --reuid=1000 --regid=1000 --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs python -m raster_priority_mosaic demo --assert
